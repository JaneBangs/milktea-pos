<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milktea POS</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ec;color:#222}
button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccc}
button{cursor:pointer;background:#fff}button.pri{background:#8b5e3c;color:#fff;border:0}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #ddd}
header b{flex:1}#login{max-width:320px;margin:15vh auto;display:grid;gap:10px;padding:16px}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs .on{background:#8b5e3c;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid button{text-align:left;min-height:84px}.grid small{display:block;color:#777}
.card{background:#fff;border-radius:10px;padding:12px}
.line{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0}
.row{display:flex;justify-content:space-between;padding:3px 0}.big{font-size:1.3em;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
#drawer{position:fixed;top:0;bottom:0;left:0;width:230px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:4px;transform:translateX(-105%);transition:transform .2s;z-index:30;box-shadow:2px 0 12px #0003}
#drawer.open{transform:none}#drawer button{text-align:left;border:0;background:none;padding:14px 10px}#drawer button:hover{background:#f4f1ec}
#scrim{position:fixed;inset:0;background:#0006;z-index:20}
.grid .tile{position:relative;padding:0;overflow:hidden;min-height:120px;background-size:cover;background-position:center}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;padding:6px 8px;font-size:.9em}.tile .cap small{color:#ddd}
.tile.nophoto .cap{background:none;color:#222;position:static;padding:10px}.tile.nophoto .cap small{color:#555}
.pages{display:flex;gap:2px;overflow-x:auto;position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;margin-top:10px}
.pages button{border:0;border-radius:0;background:none;padding:14px 16px;white-space:nowrap}.pages .on{background:none;color:#8b5e3c;border-bottom:3px solid #8b5e3c}
#picker{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:center;justify-content:center}
#picker>div{background:#fff;border-radius:12px;padding:16px;min-width:260px;display:grid;gap:8px}
</style></head><body>
<div id="login" hidden>
  <h2>Milktea POS</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button class="pri" id="loginBtn">Log in</button><div id="loginErr" style="color:#b00"></div>
</div>
<div id="app" hidden>

  <div id="scrim" hidden></div><div id="picker" hidden></div>

  <div id="sell" class="wrap">

    <div class="card">

    </div>
  </div>
  <div id="report" class="card" style="margin:12px" hidden>

      <select id="tod"><option value="0-24">All day</option><option value="6-12">Morning (6 AM–12 PM)</option><option value="12-18">Afternoon (12–6 PM)</option><option value="18-24">Evening (6 PM–12 AM)</option></select>
      <button class="pri" id="go">Show</button></div>
    <div class="tabs"><button id="rToday">Today</button><button id="r7">Last 7 days</button><button id="rMonth">This month</button><button id="rYear">This year</button></div>
    <div class="stats" id="stats"></div><div id="cmp" style="color:#777;margin-bottom:8px"></div>
    <div class="tabs" style="align-items:center"><b id="chTitle" style="flex:1"></b><select id="grp"><option value="d">Days</option><option value="w">Weeks</option><option value="m">Months</option></select></div>
    <div id="chart"></div>
    <div class="tabs" style="align-items:center;margin-top:12px"><b style="flex:1">Export</b><button id="csv">Download CSV</button></div>
    <div id="brk" style="overflow-x:auto;max-height:320px"></div>
    <h3>Sales by hour</h3><div id="hours"></div><h3>Top items</h3><div id="top"></div>
    <h3>Sales</h3><div id="list" style="overflow-x:auto"></div>
  </div>
  <div id="receipts" class="card" style="margin:12px" hidden><div id="rcptBody"></div></div>
  <div id="shift" class="card" style="margin:12px" hidden><div id="shiftBody" style="max-width:560px"></div></div>
  <div id="orders" class="card" style="margin:12px" hidden>
    <h3 style="margin-top:0">Open (unpaid) orders</h3><div id="openList" style="overflow-x:auto"></div>
    
  </div>
  <div id="inv" class="card" style="margin:12px" hidden>
    <div id="lowBanner"></div>
    <div class="tabs"><button data-t="stock">Stock</button><button data-t="buy">Buy stock</button><button data-t="sup">Suppliers</button><button data-t="rec">Recipes</button><button data-t="hist">History</button></div>
    <div id="invBody"></div>
  </div>
  <div id="items" class="card" style="margin:12px" hidden>
    <div class="tabs"><button class="pri" id="addItem">+ Add item</button>
      <label style="align-self:center"><input type="checkbox" id="showHidden"> Show hidden items</label></div>
    <div id="itemList" style="overflow-x:auto"></div>
    <div id="editor" class="card" style="border:1px solid #ddd;margin-top:12px" hidden>
      <h3 id="edTitle" style="margin-top:0"></h3>
      <div style="display:grid;gap:8px;max-width:520px">
        <input id="fName" placeholder="Name" style="font-size:1.2em">
        <div class="tabs" style="align-items:center"><img id="fImg" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px;background:#eee"><input id="fPhoto" type="file" accept="image/*"><button type="button" id="fPhotoDel">Remove photo</button></div>
        <select id="fCat"></select><input id="fCatNew" placeholder="New category name" hidden>
        <input id="fSize" placeholder="Size / variant, e.g. 16oz (optional)">
        <textarea id="fDesc" placeholder="Description" rows="2" style="padding:10px;border-radius:8px;border:1px solid #ccc;font:inherit"></textarea>
        <label><input type="checkbox" id="fActive" checked> The item is available for sale</label>
        <div>Sold by &nbsp;<label><input type="radio" name="fSold" value="each" checked> Each</label> &nbsp;<label><input type="radio" name="fSold" value="weight"> Weight/Volume</label></div>
        <input id="fPrice" type="number" min="0" step="0.01" placeholder="Price"><small>To enter the price when selling, leave the field blank</small>
        <input id="fCogs" type="number" min="0" step="0.01" placeholder="Cost"><small id="fCogsNote"></small>
        <input id="fSku" placeholder="SKU"><input id="fBar" placeholder="Barcode">
        <h4 style="margin:8px 0 0">Recipe (ingredients used per cup)</h4><div id="fRecipe"></div>
        <div class="tabs"><button class="pri" id="fSave">Save</button><button id="fCancel">Cancel</button></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// PASTE YOUR SUPABASE DETAILS HERE (Project Settings > API)
const SUPABASE_URL = 'https://tixkedgvdzritdqnwpsw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HTjl8cMVMroXfriN9T65gg_kepy8Lb_';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

const day = d => d.toLocaleDateString('en-CA');
let items = [], cat = 'All', cart = {}, custom = {}, cur = null, openOrders = [];
const pr = i => custom[i.id] ?? i.price;

(async () => {
  const { data: { session } } = await db.auth.getSession();
  session ? start() : ($('login').hidden = false);
})();
$('loginBtn').onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $('email').value, password: $('pass').value });
  error ? $('loginErr').textContent = error.message : start();
};
$('logout').onclick = async () => { await db.auth.signOut(); location.reload(); };
const show = v => ['sell', 'report', 'items', 'orders', 'inv', 'receipts', 'shift'].forEach(x => $(x).hidden = x !== v);
$('tSell').onclick = () => show('sell');
$('tInv').onclick = () => { show('inv'); loadInv(); };
$('tRcpt').onclick = () => { show('receipts'); loadReceipts(); };
$('tShift').onclick = () => { show('shift'); loadShift(); };
$('tRep').onclick = () => { show('report'); loadReport(); };
$('tItems').onclick = () => { show('items'); renderItems(); };
$('tOrders').onclick = () => { show('orders'); loadOrders(); };

async function start() {
  $('login').hidden = true; $('app').hidden = false;
  await loadItems(); setRange(new Date(), new Date()); loadInv();
}
let allItems = [], editId = null;
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function loadItems() {
  const { data, error } = await db.from('items').select('*').order('id');
  if (error) return alert(error.message);
  allItems = data; items = data.filter(i => i.active);
  if (cat !== 'All' && !items.some(i => i.category === cat)) cat = 'All';
  Object.keys(cart).forEach(id => { if (!items.find(i => i.id == id)) delete cart[id]; });
  renderTabs(); renderGrid(); renderCart();
}
function renderItems() {
  const rows = allItems.filter(i => i.active || $('showHidden').checked)
    .sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name) || a.id - b.id);
  $('itemList').innerHTML = '<table><tr><th>Item</th><th>Size</th><th>Category</th><th>Price</th><th>Cost</th><th></th></tr>' +
    rows.map(i => `<tr style="${i.active ? '' : 'opacity:.5'}"><td>${esc(i.name)}</td><td>${esc(i.size)}</td><td>${esc(i.category)}</td>
    <td>${i.price == null ? 'Ask' : P(i.price)}</td><td>${i.cogs == null ? '—' : P(i.cogs)}</td>
    <td style="white-space:nowrap"><button data-e="${i.id}">Edit</button> <button data-s="${i.id}">+ Size</button></td></tr>`).join('') + '</table>';
  $('itemList').querySelectorAll('[data-e]').forEach(b => b.onclick = () => openEditor(allItems.find(i => i.id == b.dataset.e)));
  $('itemList').querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const i = allItems.find(x => x.id == b.dataset.s); openEditor({ name: i.name, category: i.category, image_url: i.image_url }); });
}
let fLines = [], fImgUrl = null;
const showImg = () => { $('fImg').src = fImgUrl || ''; $('fImg').style.visibility = fImgUrl ? 'visible' : 'hidden'; };
$('fPhoto').onchange = async () => {
  const f = $('fPhoto').files[0]; if (!f) return;
  try {
    const bmp = await createImageBitmap(f), sc = Math.min(1, 480 / Math.max(bmp.width, bmp.height)), cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82)), path = `item-${Date.now()}.jpg`;
    const { error } = await db.storage.from('item-photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) return alert('Photo upload failed: ' + error.message);
    fImgUrl = db.storage.from('item-photos').getPublicUrl(path).data.publicUrl; showImg();
  } catch (e) { alert('Could not read that photo. Try a JPG or PNG.'); }
};
$('fPhotoDel').onclick = () => { fImgUrl = null; $('fPhoto').value = ''; showImg(); };
function openEditor(i) {
  editId = i.id || null; $('edTitle').textContent = editId ? 'Edit item' : 'New item';
  $('fName').value = i.name || ''; $('fSize').value = i.size || ''; $('fDesc').value = i.description || '';
  const cats = [...new Set(allItems.map(x => x.category))].sort();
  $('fCat').innerHTML = cats.map(c => `<option value="${esc(c)}"${c === i.category ? ' selected' : ''}>${esc(c)}</option>`).join('') + '<option value="__new">+ New category…</option>';
  if (!cats.length) $('fCat').value = '__new'; $('fCatNew').value = ''; $('fCatNew').hidden = $('fCat').value !== '__new';
  $('fPrice').value = i.price ?? ''; $('fCogs').value = i.cogs ?? ''; $('fActive').checked = i.active !== false;
  document.querySelectorAll('[name=fSold]').forEach(r => r.checked = r.value === (i.sold_by || 'each'));
  $('fSku').value = i.sku || String(Math.max(10000, ...allItems.map(x => parseInt(x.sku) || 0)) + 1); $('fBar').value = i.barcode || '';
  fImgUrl = i.image_url || null; showImg();
  fLines = (recipes[i.id] || []).map(r => ({ ingredient_id: r.ingredient_id, qty: +r.qty })); drawF();
  $('editor').hidden = false; $('fName').focus();
}
function drawF() {
  if (!ings.length) { $('fRecipe').innerHTML = '<small>Add your ingredients in the Inventory tab first, then build the recipe here.</small>'; return; }
  $('fRecipe').innerHTML = fLines.map((r, n) => { const g = ings.find(i => i.id == r.ingredient_id);
    return `<div class="line"><select data-fi="${n}" style="flex:1">${ings.map(i => `<option value="${i.id}"${i.id == r.ingredient_id ? ' selected' : ''}>${esc(i.name)}</option>`).join('')}</select>
    <input data-fq="${n}" type="number" min="0" step="any" value="${r.qty}" style="width:80px"><small>${g ? (g.brew_g_per_l > 0 ? 'ml tea' : g.unit) : ''}</small><button data-fx="${n}">✕</button></div>`; }).join('')
    + '<button id="fAddIng">+ Add component</button><div class="row"><span>Total cost per cup</span><b id="fCost"></b></div>';
  const cost = () => { const has = fLines.some(l => l.qty > 0), c = cupCost(fLines.filter(l => l.qty > 0)); $('fCost').textContent = P(c);
    $('fCogs').disabled = has; if (has) $('fCogs').value = c.toFixed(2); $('fCogsNote').textContent = has ? 'Calculated from the recipe' : ''; };
  cost(); const R = $('fRecipe');
  R.querySelectorAll('[data-fi]').forEach(x => x.onchange = () => { fLines[x.dataset.fi].ingredient_id = x.value; drawF(); });
  R.querySelectorAll('[data-fq]').forEach(x => x.oninput = () => { fLines[x.dataset.fq].qty = num(x.value); cost(); });
  R.querySelectorAll('[data-fx]').forEach(x => x.onclick = () => { fLines.splice(x.dataset.fx, 1); drawF(); });
  $('fAddIng').onclick = () => { fLines.push({ ingredient_id: ings[0].id, qty: 0 }); drawF(); };
}
$('addItem').onclick = () => openEditor({});
$('fCancel').onclick = () => $('editor').hidden = true;
$('fCat').onchange = () => $('fCatNew').hidden = $('fCat').value !== '__new';
$('showHidden').onchange = renderItems;
$('fSave').onclick = async () => {
  const cat = $('fCat').value === '__new' ? $('fCatNew').value.trim() : $('fCat').value, lines = fLines.filter(l => l.qty > 0), price = $('fPrice').value.trim();
  const row = { name: $('fName').value.trim(), size: $('fSize').value.trim() || null, category: cat, description: $('fDesc').value.trim() || null,
    price: price === '' ? null : parseFloat(price), active: $('fActive').checked, sold_by: document.querySelector('[name=fSold]:checked').value,
    sku: $('fSku').value.trim() || null, barcode: $('fBar').value.trim() || null, image_url: fImgUrl,
    cogs: lines.length ? Math.round(cupCost(lines) * 100) / 100 : ($('fCogs').value === '' ? null : parseFloat($('fCogs').value)) };
  if (!row.name || !row.category || (row.price !== null && isNaN(row.price))) return alert('Please fill in the name and category, and check the price.');
  let r = editId ? await db.from('items').update(row).eq('id', editId).select().single() : await db.from('items').insert(row).select().single();
  if (r.error) return alert(r.error.message);
  const id = r.data.id;
  if (ings.length) {
    r = await db.from('recipe_lines').delete().eq('item_id', id); if (r.error) return alert(r.error.message);
    if (lines.length) { r = await db.from('recipe_lines').insert(lines.map(l => ({ item_id: id, ingredient_id: l.ingredient_id, qty: l.qty }))); if (r.error) return alert(r.error.message); }
  }
  $('editor').hidden = true; await loadInv(); await loadItems(); renderItems();
};
let ings = [], sups = [], recipes = {}, stockMap = {}, invTab = 'stock', buyLines = [], edit = null;
const num = v => parseFloat(v) || 0;
const ingF = () => [{ k: 'name', l: 'Ingredient name' }, { k: 'category', opts: [['Ingredient', 'Ingredient'], ['Packaging', 'Packaging']] },
  { k: 'unit', opts: [['g', 'Grams (g)'], ['ml', 'Milliliters (ml)'], ['pcs', 'Pieces (pcs)']] },
  { k: 'pack_size', l: 'Amount in one pack (g / ml / pcs)', t: 'number' }, { k: 'pack_price', l: 'Price per pack (₱)', t: 'number' },
  { k: 'supplier_id', opts: [['', 'No supplier'], ...sups.map(s => [s.id, s.name])] }, { k: 'low_stock', l: 'Warn when stock is at or below (g / ml / pcs)', t: 'number' },
  { k: 'brew_g_per_l', l: 'Tea only: grams of leaves per 1000 ml brewed (e.g. 20)', t: 'number' }];
const supF = [['name', 'Supplier name'], ['contact', 'Contact'], ['email', 'Email'], ['phone', 'Phone'], ['website', 'Website'], ['address1', 'Address 1'],
  ['address2', 'Address 2'], ['city', 'City'], ['region', 'Region'], ['postal_code', 'Postal code'], ['country', 'Country'], ['note', 'Note']].map(([k, l]) => ({ k, l }));
const formHTML = (fs, v) => fs.map(f => f.opts ? `<select id="f_${f.k}">${f.opts.map(o => `<option value="${esc(o[0])}"${String(v[f.k] ?? '') === String(o[0]) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
  : `<input id="f_${f.k}" placeholder="${f.l}" ${f.t ? 'type="number" step="any" min="0"' : ''} value="${esc(v[f.k] ?? '')}">`).join('');
const readForm = fs => { const o = {}; fs.forEach(f => { const x = $('f_' + f.k).value.trim(); o[f.k] = f.t ? num(x) : (x === '' ? null : x); }); return o; };
const editBox = (title, fs) => `<div class="card" style="border:1px solid #ddd;margin:8px 0"><h3 style="margin-top:0">${edit.id ? 'Edit' : 'New'} ${title}</h3>
  <div style="display:grid;gap:8px;max-width:380px">${formHTML(fs, edit.v)}<div class="tabs"><button class="pri" id="eSave">Save</button><button id="eCancel">Cancel</button></div></div></div>`;
function wireEdit(table, fs) {
  if (!$('eSave')) return;
  $('eCancel').onclick = () => { edit = null; renderInv(); };
  $('eSave').onclick = async () => {
    const o = readForm(fs); if (!o.name) return alert('Please enter a name.');
    if (table === 'ingredients' && !(o.pack_size > 0)) return alert('Amount in one pack must be more than 0.');
    const r = edit.id ? await db.from(table).update(o).eq('id', edit.id) : await db.from(table).insert(o);
    if (r.error) return alert(r.error.message); edit = null; await loadInv(); if (table === 'ingredients') recalcCosts();
  };
}
async function loadInv() {
  const [a, b, c, d] = await Promise.all([db.from('ingredients').select('*').eq('active', true).order('category').order('name'),
    db.from('suppliers').select('*').order('name'), db.from('ingredient_stock').select('*'), db.from('recipe_lines').select('*')]);
  const err = a.error || b.error || c.error || d.error; if (err) return console.warn(err.message);
  ings = a.data; sups = b.data; stockMap = {}; recipes = {}; d.data.forEach(r => (recipes[r.item_id] = recipes[r.item_id] || []).push(r)); c.data.forEach(r => stockMap[r.ingredient_id] = +r.stock);
  const low = ings.filter(i => i.low_stock > 0 && (stockMap[i.id] || 0) <= i.low_stock);
  $('tInv').textContent = low.length ? `Inventory (${low.length} low)` : 'Inventory'; $('menu').textContent = low.length ? '☰ ●' : '☰';
  $('lowBanner').innerHTML = low.length ? `<div style="background:#fde8e8;padding:8px;border-radius:8px;margin-bottom:8px"><b>Time to restock:</b> ${low.map(i => esc(i.name) + ' (' + +(stockMap[i.id] || 0).toFixed(2) + ' ' + i.unit + ' left)').join(', ')}</div>` : '';
  if (!$('inv').hidden) renderInv();

$('inv').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { invTab = b.dataset.t; edit = null; renderInv(); });

      .lt('paid_at', to.toISOString()).order('paid_at', { ascending: false }).range(p * 1000, p * 1000 + 999);
